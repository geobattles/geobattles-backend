# Development database only. No application image or production credentials.
name: geobattles-dev
services:
  database:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    restart: "no"
    environment:
      POSTGRES_USER: geobattles_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run make setup first}
      POSTGRES_DB: geobattles_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
volumes:
  db-data:
