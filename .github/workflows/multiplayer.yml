name: Multiplayer match
on: [pull_request]
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: geo-backend
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geobattles/geobattles-frontend
          ref: bdc5d2f74eab54ea2f661eb643acd4bc1f8e0baf
          path: geo-frontend
          persist-credentials: false
      - uses: ./geo-frontend/.github/actions/check-match
