# Local Windows/Docker Desktop LAN preview. Never use production credentials.
# Run from geo-backend: env -u DB_PASSWORD docker compose --env-file .env -f deploy/compose.lan.yml up -d --build --wait
name: geobattles-lan

services:
  database:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    restart: unless-stopped
    environment:
      POSTGRES_USER: geobattles_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run make setup in geo-backend first}
      POSTGRES_DB: geobattles_dev
    volumes:
      - lan-db-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: geobattles-backend:local-lan
    build:
      context: ..
      args:
        VERSION: ${GEOBATTLES_BUILD_VERSION:-local-lan}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: database
      DB_USER: geobattles_dev
      DB_NAME: geobattles_dev
      DB_PASSWORD: ${DB_PASSWORD:?Run make setup in geo-backend first}
      LISTEN_ADDR: 0.0.0.0:8080
      LOG_LEVEL: INFO
    depends_on:
      database:
        condition: service_healthy
    networks:
      - web
      - database
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: geobattles-frontend:local-lan
    build:
      context: ../../geo-frontend
      args:
        VERSION: ${GEOBATTLES_BUILD_VERSION:-local-lan}
    restart: unless-stopped
    env_file:
      - ../../geo-frontend/.env
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_PUBLIC_BACKEND_HOST: /api
      NUXT_BACKEND_SERVER_HOST: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "0.0.0.0:${GEOBATTLES_LAN_PORT:-8088}:8080"
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - web
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  web:
  database:
    internal: true

volumes:
  lan-db-data:
